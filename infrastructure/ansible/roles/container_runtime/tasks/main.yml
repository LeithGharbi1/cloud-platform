---
- name: Install containerd
  apt:
    name: "{{ container_runtime_package }}"
    state: present
    update_cache: yes


- name: Create containerd configuration directory
  file:
    path: /etc/containerd
    state: directory
    mode: '0755'


- name: Configure containerd
  template:
    src: config.toml.j2
    dest: /etc/containerd/config.toml
    mode: '0644'
  notify:
    - Restart containerd


- name: Enable containerd
  systemd:
    name: containerd
    enabled: yes
    state: started