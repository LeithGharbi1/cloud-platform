---

- name: Initialize Kubernetes cluster
  command: >
    kubeadm init
    --apiserver-advertise-address={{ control_plane_endpoint }}
    --pod-network-cidr={{ pod_network_cidr }}
  args:
    creates: /etc/kubernetes/admin.conf


- name: Create .kube directory
  file:
    path: /home/vagrant/.kube
    state: directory
    owner: vagrant
    group: vagrant
    mode: '0755'


- name: Copy kubeconfig
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/vagrant/.kube/config
    remote_src: yes
    owner: vagrant
    group: vagrant
    mode: '0644'


- name: Copy Calico manifest
  copy:
    src: calico.yml
    dest: /tmp/calico.yml
    mode: '0644'


- name: Wait for Kubernetes API server
  command: kubectl get nodes
  environment:
    KUBECONFIG: /home/vagrant/.kube/config
  register: api_ready
  retries: 10
  delay: 10
  until: api_ready.rc == 0
  changed_when: false


- name: Install Calico CNI plugin
  command: kubectl apply -f /tmp/calico.yml
  environment:
    KUBECONFIG: /home/vagrant/.kube/config
  register: calico_apply
  changed_when: >
    'created' in calico_apply.stdout or
    'configured' in calico_apply.stdout


- name: Check if kubeadm join command exists
  stat:
    path: /etc/kubernetes/kubeadm_join_command
  register: join_command_file


- name: Generate kubeadm join command
  command: kubeadm token create --ttl 0 --print-join-command
  register: kubeadm_join_command
  changed_when: false
  when: not join_command_file.stat.exists


- name: Save join command fact
  set_fact:
    worker_join_command: "{{ kubeadm_join_command.stdout }}"
  when: not join_command_file.stat.exists


- name: Save join command for workers
  copy:
    content: "{{ worker_join_command }}"
    dest: /etc/kubernetes/kubeadm_join_command
    mode: '0600'
  when: not join_command_file.stat.exists