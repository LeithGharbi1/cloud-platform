---

- name: Check if node already joined
  stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Configure kubelet node IP
  lineinfile:
    path: /var/lib/kubelet/kubeadm-flags.env
    regexp: 'KUBELET_KUBEADM_ARGS='
    line: 'KUBELET_KUBEADM_ARGS="--node-ip={{ ansible_host }}"'

- name: Restart kubelet
  systemd:
    name: kubelet
    state: restarted

- name: Fetch kubeadm join command from master
  slurp:
    src: /etc/kubernetes/kubeadm_join_command
  delegate_to: master
  register: join_command
  when: not kubelet_conf.stat.exists


- name: Join worker node to Kubernetes cluster
  command: "{{ join_command.content | b64decode }}"
  become: yes
  register: kubeadm_join_result
  when: not kubelet_conf.stat.exists


- name: Display join result
  debug:
    var: kubeadm_join_result.stdout
  when: kubeadm_join_result is defined