trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  acrLoginServer: 'acrcloudplatformdev01.azurecr.io'
  imageRepository: 'demo-app'
  imageTag: '$(Build.BuildId)'

  aksResourceGroup: 'rg-cloud-platform-dev'
  aksClusterName: 'aks-cloud-platform-dev'

  namespace: 'helm-test'
  helmRelease: 'demo-app'

stages:

# ============================================================
# CI
# ============================================================

- stage: Build
  displayName: 'Build and Push Docker Image'

  jobs:

  - job: BuildAndPush
    displayName: 'Build Docker Image'

    steps:

    - checkout: self

    - task: AzureCLI@2
      displayName: 'Build and Push Image to ACR'
      inputs:
        azureSubscription: 'cloud-platform-pipeline'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          echo "Logging into ACR..."

          az acr login \
            --name acrcloudplatformdev01

          echo "Building image..."

          docker build \
            -t $(acrLoginServer)/$(imageRepository):$(imageTag) \
            apps/demo-app

          echo "Pushing image..."

          docker push \
            $(acrLoginServer)/$(imageRepository):$(imageTag)

          echo "Successfully pushed:"
          echo "$(acrLoginServer)/$(imageRepository):$(imageTag)"


# ============================================================
# CD
# ============================================================

- stage: Deploy
  displayName: 'Deploy to AKS'
  dependsOn: Build
  condition: succeeded()

  jobs:

  - job: DeployToAKS
    displayName: 'Deploy with Helm'

    steps:

    - checkout: self

    - task: HelmInstaller@1
      displayName: 'Install Helm'
      inputs:
        helmVersionToInstall: 'latest'

    - task: AzureCLI@2
      displayName: 'Deploy Helm Chart to AKS'
      inputs:
        azureSubscription: 'cloud-platform-pipeline'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          echo "Getting AKS credentials..."

          az aks get-credentials \
            --resource-group $(aksResourceGroup) \
            --name $(aksClusterName) \
            --overwrite-existing

          echo "Deploying image:"
          echo "$(acrLoginServer)/$(imageRepository):$(imageTag)"

          helm upgrade --install $(helmRelease) \
            apps/demo-app-chart \
            --namespace $(namespace) \
            --create-namespace \
            --set image.repository=$(acrLoginServer)/$(imageRepository) \
            --set image.tag=$(imageTag) \
            --wait \
            --timeout 5m

    - task: AzureCLI@2
      displayName: 'Verify Deployment'
      inputs:
        azureSubscription: 'cloud-platform-pipeline'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          echo "=== Pods ==="
          kubectl get pods -n $(namespace)

          echo ""
          echo "=== Deployment ==="
          kubectl get deployment -n $(namespace)

          echo ""
          echo "=== Service ==="
          kubectl get service -n $(namespace)

          echo ""
          echo "=== Helm Release ==="
          helm status $(helmRelease) -n $(namespace)